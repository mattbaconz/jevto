name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, exe: jevto }
          - { os: macos-latest, target: aarch64-apple-darwin, exe: jevto }
          - { os: macos-13, target: x86_64-apple-darwin, exe: jevto }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, exe: jevto.exe }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p jevto --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="jevto-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" README.md LICENSE CHANGELOG.md "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: jevto-*.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum jevto-* > SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --title "JevTO $GITHUB_REF_NAME" --notes-file CHANGELOG.md
