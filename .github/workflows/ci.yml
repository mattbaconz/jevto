name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --workspace
      - name: Build
        run: cargo build -p jevto
      - name: CLI smoke
        run: python tests/cli_smoke.py
      - name: Claude auto-route smoke
        shell: bash
        run: python tests/claude_auto_smoke.py
      - name: MCP runner smoke
        run: python tests/mcp_run_smoke.py
      - name: Request accounting smoke (offline)
        run: python tests/accounting_smoke.py
      - name: Fresh task controls (offline)
        run: python tests/fresh_tasks_smoke.py
