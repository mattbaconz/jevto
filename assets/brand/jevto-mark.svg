  <rect x="13" y="15" width="28" height="7" rx="1.5" fill="#F7F5F0"/>
  <rect x="13" y="28.5" width="7" height="7" rx="1.5" fill="#8B8F97"/>
  <rect x="24.5" y="28.5" width="7" height="7" rx="1.5" fill="#8B8F97"/>
  <rect x="36" y="28.5" width="7" height="7" rx="1.5" fill="#8B8F97"/>
  <rect x="13" y="42" width="38" height="7" rx="1.5" fill="#E5231B"/>
</svg>
